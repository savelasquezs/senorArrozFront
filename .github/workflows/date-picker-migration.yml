name: Date picker migration

on:
  push:
    branches:
      - agent/date-picker-standardization

permissions:
  contents: write

jobs:
  migrate-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: agent/date-picker-standardization
          fetch-depth: 0

      - name: Apply scoped replacements
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path_str: str, old: str, new: str) -> None:
              path = Path(path_str)
              raw = path.read_bytes()
              text = raw.decode('utf-8')
              newline = '\r\n' if '\r\n' in text else '\n'
              old_native = old.replace('\n', newline)
              new_native = new.replace('\n', newline)
              count = text.count(old_native)
              if count != 1:
                  raise SystemExit(f'{path_str}: expected exactly one match, found {count}')
              path.write_bytes(text.replace(old_native, new_native, 1).encode('utf-8'))

          replace_once(
              'src/views/OrdersList.vue',
              '''                                    <div class="flex items-center gap-2 flex-wrap">
                                        <span class="text-xs text-gray-500 whitespace-nowrap">Fecha evento:</span>
                                        <BaseInput v-model="resFrom" type="date" class="w-32 sm:w-36"
                                            @change="fetchReservations" />
                                        <span class="text-gray-400">-</span>
                                        <BaseInput v-model="resTo" type="date" class="w-32 sm:w-36"
                                            @change="fetchReservations" />
                                    </div>''',
              '''                                    <div class="flex items-center gap-2 flex-wrap">
                                        <span class="text-xs text-gray-500 whitespace-nowrap">Fecha evento:</span>
                                        <BaseYmdDateRangePicker v-model:from-date="resFrom" v-model:to-date="resTo"
                                            variant="compact" @change="fetchReservations" />
                                    </div>''',
          )
          replace_once(
              'src/views/OrdersList.vue',
              "import BaseDateRangePicker from '@/components/ui/BaseDateRangePicker.vue'",
              "import BaseDateRangePicker from '@/components/ui/BaseDateRangePicker.vue'\nimport BaseYmdDateRangePicker from '@/components/ui/BaseYmdDateRangePicker.vue'",
          )

          replace_once(
              'src/components/payments/banks/BankMovementsPanel.vue',
              '''                <div v-if="!lockDateRange" class="flex flex-wrap items-end gap-2">
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-0.5">Desde</label>
                        <input v-model="fromDate" type="date"
                            class="border border-gray-300 rounded-md px-2 py-1.5 text-sm" />
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-0.5">Hasta</label>
                        <input v-model="toDate" type="date"
                            class="border border-gray-300 rounded-md px-2 py-1.5 text-sm" />
                    </div>
                    <BaseButton variant="primary" size="sm" :loading="summaryLoading" @click="applyRange">
                        Aplicar
                    </BaseButton>
                </div>''',
              '''                <div v-if="!lockDateRange" class="flex flex-wrap items-end gap-2">
                    <BaseYmdDateRangePicker v-model:from-date="fromDate" v-model:to-date="toDate"
                        variant="compact" />
                    <BaseButton variant="primary" size="sm" :loading="summaryLoading" @click="applyRange">
                        Aplicar
                    </BaseButton>
                </div>''',
          )
          replace_once(
              'src/components/payments/banks/BankMovementsPanel.vue',
              "import BaseLoading from '@/components/ui/BaseLoading.vue'",
              "import BaseLoading from '@/components/ui/BaseLoading.vue'\nimport BaseYmdDateRangePicker from '@/components/ui/BaseYmdDateRangePicker.vue'",
          )

          replace_once(
              'src/views/KitchenView.vue',
              '''                            <BaseInput v-model="summaryDate" type="date" label="Fecha" />''',
              '''                            <BaseDatePicker v-model="summaryDate" label="Fecha" />''',
          )
          replace_once(
              'src/views/KitchenView.vue',
              "import BaseInput from '@/components/ui/BaseInput.vue'",
              "import BaseInput from '@/components/ui/BaseInput.vue'\nimport BaseDatePicker from '@/components/ui/BaseDatePicker.vue'",
          )

          replace_once(
              'src/views/DeliverymenManagementView.vue',
              '''                    <BaseInput
                        v-model="selectedDate"
                        type="date"
                        @change="handleDateChange"
                        class="w-48"
                    />''',
              '''                    <BaseDatePicker
                        v-model="selectedDate"
                        @change="handleDateChange"
                        class="w-48"
                    />''',
          )
          replace_once(
              'src/views/DeliverymenManagementView.vue',
              "import BaseInput from '@/components/ui/BaseInput.vue'",
              "import BaseInput from '@/components/ui/BaseInput.vue'\nimport BaseDatePicker from '@/components/ui/BaseDatePicker.vue'",
          )

          replace_once(
              'src/components/expenses/ExpenseDetailsTable.vue',
              '''                        <input v-else-if="column.key === 'createdAt'" v-model="filters.createdAt" type="date"
                            class="w-full rounded border border-gray-200 px-1 py-1 text-[11px] font-normal outline-none focus:border-emerald-500">''',
              '''                        <BaseDatePicker v-else-if="column.key === 'createdAt'" v-model="filters.createdAt"
                            variant="compact" />''',
          )
          replace_once(
              'src/components/expenses/ExpenseDetailsTable.vue',
              "import { defaultBusinessCalendar } from '@/utils/datetime'",
              "import { defaultBusinessCalendar } from '@/utils/datetime'\nimport BaseDatePicker from '@/components/ui/BaseDatePicker.vue'",
          )

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Validate whitespace
        run: git diff --check

      - name: Commit validated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/views/OrdersList.vue \
                  src/components/payments/banks/BankMovementsPanel.vue \
                  src/views/KitchenView.vue \
                  src/views/DeliverymenManagementView.vue \
                  src/components/expenses/ExpenseDetailsTable.vue
          git diff --cached --quiet && exit 0
          git commit -m "refactor: standardize remaining date pickers"
          git push origin HEAD:agent/date-picker-standardization
