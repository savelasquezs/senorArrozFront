name: Validate operational checklist
on:
  push:
    branches: [feat/operational-checklist-20261115]
    paths: [.checklist.patch.b64]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified feature patch on this branch only
        run: |
          base64 --decode .checklist.patch.b64 | gzip -d > /tmp/checklist.patch
          echo '048875ca058831793d5ecccb24893eaaa1179d0097ab0b6887da4a2645af21f2  /tmp/checklist.patch' | sha256sum --check
          git apply --check /tmp/checklist.patch
          git apply /tmp/checklist.patch
          rm -f .checklist.patch.b64 .github/workflows/apply-checklist.yml .github/workflows/checklist-workspace.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: shared branch checklist with animated navbar and admin settings'
          git push origin HEAD:feat/operational-checklist-20261115
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build POS
        env:
          VITE_API_URL: https://api.example.invalid/api
        run: npm run build
      - name: Full frontend tests
        run: npm run test:run -- --reporter=default --reporter=junit --outputFile=/tmp/checklist-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checklist-test-results
          path: |
            /tmp/checklist-results.xml
            /tmp/checklist.patch
          retention-days: 3
