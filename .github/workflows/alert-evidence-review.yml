name: Alert evidence review
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/tracking-alert-evidence'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Apply reviewed frontend evidence changes
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          source = pathlib.Path('.automation/front-alert.b64')
          raw = lzma.decompress(base64.b64decode(source.read_text().strip(), validate=True))
          assert hashlib.sha256(raw).hexdigest() == '9b533c078854009406cd38ee2f14f3030b73ab83190d2d60f8484179ad7ffaee'
          patch = pathlib.Path('/tmp/front-alert.patch'); patch.write_bytes(raw)
          subprocess.run(['git','apply','--check','--index','--unidiff-zero',str(patch)],check=True)
          subprocess.run(['git','apply','--index','--unidiff-zero',str(patch)],check=True)
          source.unlink()
          pathlib.Path('.github/workflows/alert-evidence-review.yml').unlink()
          PY
      - name: Commit feature implementation and remove temporary workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add src docs
          git add -u
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(tracking): show supported evidence and scoped administrative alerts'
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$AUTH"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/fix/tracking-alert-evidence
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:run
